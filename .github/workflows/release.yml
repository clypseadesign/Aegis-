name: Release

# Publishes container images for a tagged release and deploys to staging.
#
# Trigger: push a semver tag (see docs/release-process.md).
#
#   git tag -a v0.1.0 -m "v0.1.0"
#   git push origin v0.1.0

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to deploy to staging (tag or branch)'
        required: true
        default: main

concurrency:
  # Never run two releases for staging at once.
  group: release-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify release
    # Re-run the full gate so an image is never built from an untested commit.
    uses: ./.github/workflows/backend.yml
    if: startsWith(github.ref, 'refs/tags/')

  verify-frontend:
    name: Verify release (frontend)
    uses: ./.github/workflows/frontend.yml
    if: startsWith(github.ref, 'refs/tags/')

  images:
    name: Build & publish images
    needs: [verify, verify-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to push to GHCR. Granted only to this job.
      packages: write
    outputs:
      backend-image: ghcr.io/${{ github.repository }}-backend:${{ github.ref_name }}
      frontend-image: ghcr.io/${{ github.repository }}-frontend:${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        run: |
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "short=$(echo "$GITHUB_REF_NAME" | sed 's/^v//')" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-backend:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository }}-backend:${{ steps.meta.outputs.short }}
            ghcr.io/${{ github.repository }}-backend:latest
          # Provenance attestation and SBOM give a reviewer a way to verify what
          # actually shipped.
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-frontend:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository }}-frontend:${{ steps.meta.outputs.short }}
            ghcr.io/${{ github.repository }}-frontend:latest
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to staging
    needs: images
    runs-on: ubuntu-latest
    environment: staging
    # A failed staging deploy should not silently roll production.
    steps:
      - name: Deploy
        # STAGING_SSH_KEY / STAGING_HOST / STAGING_PATH are repository or
        # environment secrets. Nothing sensitive is stored in this repository.
        # See docs/secrets-management.md.
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Pin the host key so a swapped server fails the deploy instead of
          # silently accepting an unknown key.
          ssh-keyscan -H "$STAGING_HOST" >> ~/.ssh/known_hosts

          rsync -az --delete \
            --exclude '.env' \
            --exclude 'docker-data' \
            docker-compose.production.yml "$STAGING_HOST:$STAGING_PATH/"

          ssh "$STAGING_HOST" "cd $STAGING_PATH && \
            export AEGIS_BACKEND_IMAGE='${{ needs.images.outputs.backend-image }}' && \
            export AEGIS_FRONTEND_IMAGE='${{ needs.images.outputs.frontend-image }}' && \
            docker compose -f docker-compose.production.yml pull && \
            # Migrations run before the new version takes traffic.
            docker compose -f docker-compose.production.yml run --rm migrate && \
            docker compose -f docker-compose.production.yml up -d && \
            docker compose -f docker-compose.production.yml ps"

      - name: Verify staging
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl --fail --silent "https://${{ secrets.STAGING_HOST }}/api/v1/system/ready" | grep -q '"status":"ok"'; then
              echo "staging is serving"
              exit 0
            fi
            sleep 5
          done
          echo "staging did not become ready"
          exit 1
