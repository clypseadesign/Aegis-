name: Backend quality

# Fast feedback on every push and pull request. The Postgres service is required
# because the test suite and `alembic check` both need a real database — the
# models use JSONB and native enums, so SQLite is not a valid substitute.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # Cancel superseded runs for the same ref, but never cancel main.
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.16.6,<1"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pyright>=1.1.413,<2"

      - name: Pyright
        run: pyright

  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis_ci_password
          POSTGRES_DB: aegis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://aegis:aegis_ci_password@localhost:5432/aegis_test
      # Non-production key used only for the duration of the run.
      SECRET_KEY: ci_test_secret_key_not_used_outside_ci_000000
      APP_ENV: testing

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        # The project declares dev tooling under PEP 735 [dependency-groups],
        # which pip cannot install as an extra. Install the test requirements
        # explicitly instead.
        run: |
          python -m pip install --upgrade pip
          pip install . "pytest>=9.1,<10" "httpx2>=2.13,<3"

      - name: Apply migrations
        run: alembic upgrade head

      - name: Verify model/migration parity
        # Fails if a model change has no matching migration.
        run: alembic check

      - name: Run pytest
        run: pytest -q --maxfail=1

      - name: Dependency audit
        # Fails the build on a known-CVE dependency.
        run: |
          pip install pip-audit
          pip-audit --strict --progress-spinner off
