name: Container images

# Proves both images still build and still run. A Dockerfile that builds but
# crashes on start is a common failure mode, so this starts the real stack and
# exercises the full request path rather than only compiling.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/containers.yml'
  workflow_dispatch:

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build-and-smoke:
    name: Build & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t aegis-backend:ci .

      - name: Build frontend image
        run: docker build -t aegis-frontend:ci frontend

      - name: Start the stack
        env:
          # Ephemeral key, scoped to this run only.
          SECRET_KEY: ci_container_secret_key_not_used_outside_ci_000
        run: docker compose up -d --wait --wait-timeout 180

      - name: Backend reports healthy
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health > /dev/null; then
              echo "backend healthy"
              exit 0
            fi
            sleep 2
          done
          echo "backend never became healthy"
          docker compose logs
          exit 1

      - name: Frontend serves the SPA and proxies the API
        run: |
          curl --fail --silent http://127.0.0.1:8080/ | grep -q 'id="root"'
          echo "SPA shell served"
          # The nginx /api proxy must reach the backend on the internal network.
          curl --fail --silent http://127.0.0.1:8080/api/v1/system/ready | grep -q '"status":"ok"'
          echo "API proxy works"
          # Client-side routing must fall back to the app shell, not 404.
          curl --fail --silent http://127.0.0.1:8080/projects/some/deep/route | grep -q 'id="root"'
          echo "SPA history fallback works"

      - name: Migrations apply cleanly
        run: docker compose exec -T backend alembic upgrade head

      - name: Database is not exposed beyond loopback
        # ADR-015 forbids exposing PostgreSQL to the Internet. In this compose
        # file it is bound to 127.0.0.1, so a non-loopback address must fail.
        run: |
          if curl --fail --silent --max-time 5 http://$(hostname -i | awk '{print $1}'):5432/ > /dev/null 2>&1; then
            echo "ERROR: database reachable on a non-loopback address"
            exit 1
          fi
          echo "database is not publicly reachable"

      - name: Collect logs
        if: always()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
